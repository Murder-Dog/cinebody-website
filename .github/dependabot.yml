version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # satori draws the link-preview cards (site/src/og/template.ts). Newer
      # versions drop the colour stripe and cinebody.com from the card, so hold
      # it back until the card is updated to match.
      - dependency-name: "satori"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
